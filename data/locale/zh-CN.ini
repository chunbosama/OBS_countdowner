Source.Name=倒计时
State.Idle=空闲
State.Running=运行中
State.Paused=已暂停
State.Finished=已结束
State.Suspended=运行中（已隐藏，暂停计时）

Hotkey.Start=开始倒计时
Hotkey.Toggle=暂停 / 继续
Hotkey.Stop=停止（保留剩余）
Hotkey.Reset=重置为设定时长

Action.Start=开始
Action.Toggle=暂停 / 继续
Action.Pause=暂停
Action.Resume=继续
Action.Stop=停止
Action.Reset=重置

QuickBar.Title=倒计时控制
QuickBar.Empty=场景里还没有倒计时源。新建「倒计时」源之后，这里会自动列出每一个实例。
QuickBar.Frozen=已冻结

Prop.Label=实例标签（留空则显示源名）
Prop.Hours=设定时长（小时）
Prop.Minutes=设定时长（分钟）
Prop.Seconds=设定时长（秒）
Prop.Format=显示格式
Prop.Style=外观样式
Prop.Padding=内边距（数字到边框 / 圆环的距离）
Prop.Radius=卡片圆角
Prop.CardColor=卡片颜色
Prop.CardOpacity=卡片不透明度
Prop.Thickness=进度粗细
Prop.ProgressColor=进度颜色（结束时用结束色）
Prop.TrackColor=轨道颜色
Prop.TrackOpacity=轨道不透明度
Prop.ShowTicks=显示 12 个钟面刻度
Info.Remaining=剩余
Info.Set=设定
Prop.Font=字体
Prop.Color=文字颜色
Prop.EndColor=结束时的颜色
Prop.Outline=描边
Prop.OutlineColor=描边颜色
Prop.OutlineSize=描边粗细
Prop.Blink=结束时闪烁 3 秒
Prop.Align=水平对齐
Prop.Valign=垂直对齐

Format.Auto=自动（不足 1 小时显示 MM:SS）
Format.Hours=始终显示小时 HH:MM:SS
Format.Chinese=中文（5分00秒）
Format.Seconds=纯秒数（300）

Style.Digits=纯数字
Style.Card=卡片
Style.Ring=圆环（钟面）
Style.Bar=进度条

Align.Start=起始
Align.Center=居中
Align.End=末尾
